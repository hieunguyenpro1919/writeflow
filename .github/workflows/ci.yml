name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Type check (TypeScript strict)
        run: npm run typecheck

      - name: Lint code (ESLint)
        run: npm run lint

      - name: Verify formatting (Prettier)
        run: npm run format

      - name: Run unit & integration tests (Vitest)
        run: npm run test

      - name: Build production bundle (Vite)
        run: npm run build
